groups:
  - name: llm-cost
    rules:
      - record: llm:cost_usd:increase1h
        expr: |
          sum(increase(gen_ai_client_token_usage_sum{gen_ai_token_type="input", gen_ai_response_model="claude-opus-5-5"}[1h])) * 0.000004
          + sum(increase(gen_ai_client_token_usage_sum{gen_ai_token_type="output", gen_ai_response_model="claude-opus-5-5"}[1h])) * 0.000020

      - alert: HourlyCostSurge
        expr: llm:cost_usd:increase1h > 10
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "시간당 비용이 $10 초과 (5분 지속)"

      - alert: DailyBudgetForecast
        expr: llm:cost_usd:increase1h * 24 > 50  # 일일 예산(USD)을 숫자로 직접 쓴다
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "현재 시간당 속도로 하루를 가면 일일 예산($50) 초과 (30분 지속)"
