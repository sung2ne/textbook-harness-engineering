groups:
  - name: llm-cost
    rules:
      - alert: HourlyCostSurge
        expr: llm:cost_usd:increase1h > 10
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "시간당 비용 $10 초과"
          runbook_url: "https://wiki.example.com/runbooks/llm-cost-surge"
          description: |
            절차:
            1. trace의 사용자별 집계(app.user.id)에서 비정상 사용자 식별
            2. 해당 사용자의 trace 검토
            3. 무한 루프 의심 시 일시 차단
            4. 사고 회고 등록
